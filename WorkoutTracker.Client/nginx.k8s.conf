server {
    listen 80;
    server_name _;

    resolver kube-dns.kube-system.svc.cluster.local valid=10s ipv6=off;
    set $api_upstream http://api.default.svc.cluster.local:8080;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass $api_upstream;
    }

    location = /login {
        proxy_pass $api_upstream;
    }

    location = /logout {
        proxy_pass $api_upstream;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}